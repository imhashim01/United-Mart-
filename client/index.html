<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X2T226PX3Z"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-X2T226PX3Z');
    </script>

    <!-- Favicon — SVG for modern browsers, PNG fallback for Google search results
         and older browsers, which don't reliably support SVG-only favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>United Mart Sukkur — Fresh Groceries, Delivered</title>
    <meta
      name="description"
      content="Fresh groceries sourced daily and delivered across Sukkur & Rohri. Premium quality, honest prices."
    />

    <!-- Open Graph — controls the image/title/description shown in Google
         search result rich snippets, and link previews on WhatsApp, Facebook,
         Instagram, etc. Without this, they auto-pick a random image/text off
         the page instead. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="United Mart Sukkur" />
    <meta property="og:title" content="United Mart Sukkur — Fresh Groceries, Delivered" />
    <meta
      property="og:description"
      content="Fresh groceries sourced daily and delivered across Sukkur & Rohri. Premium quality, honest prices."
    />
    <meta property="og:image" content="https://unitedmartsukkur.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://unitedmartsukkur.com/" />

    <!-- Twitter/X card — same purpose as Open Graph, for platforms that read
         this format specifically -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="United Mart Sukkur — Fresh Groceries, Delivered" />
    <meta
      name="twitter:description"
      content="Fresh groceries sourced daily and delivered across Sukkur & Rohri. Premium quality, honest prices."
    />
    <meta name="twitter:image" content="https://unitedmartsukkur.com/og-image.jpg" />

    <!-- Structured data — tells Google explicitly that this is a real local
         business, which is what search engines actually use (not styling
         choices) to decide whether to show richer results over time -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GroceryStore",
        "name": "United Mart Sukkur",
        "url": "https://unitedmartsukkur.com/",
        "logo": "https://unitedmartsukkur.com/favicon.png",
        "image": "https://unitedmartsukkur.com/og-image.jpg",
        "telephone": "+92-333-7111954",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Anaj Bazar",
          "addressLocality": "Sukkur",
          "addressRegion": "Sindh",
          "addressCountry": "PK"
        },
        "priceRange": "$$"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
